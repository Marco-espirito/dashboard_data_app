<div class="row g-3 mb-4">
    <div class="col-6 col-xl-3"><div class="metric-card"><span>Chiffre d’affaires</span><strong>{{ summary.total_sales|floatformat:2 }} €</strong></div></div>
    <div class="col-6 col-xl-3"><div class="metric-card"><span>Transactions</span><strong>{{ summary.transaction_count }}</strong></div></div>
    <div class="col-6 col-xl-3"><div class="metric-card"><span>Articles vendus</span><strong>{{ summary.total_quantity }}</strong></div></div>
    <div class="col-6 col-xl-3"><div class="metric-card"><span>Produits</span><strong>{{ summary.product_count }}</strong></div></div>
</div>
